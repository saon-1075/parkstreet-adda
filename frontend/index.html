<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#FBF6EE" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Park Street Adda" />

    <!-- SEO + social share (reskin: update these per client) -->
    <title>Park Street Adda — Kolkata's living-room cafe</title>
    <meta
      name="description"
      content="Rolls, kosha mangsho & clay-cup chai — order straight to WhatsApp. No apps, no commission."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Park Street Adda — Kolkata's living-room cafe" />
    <meta
      property="og:description"
      content="Rolls, kosha mangsho & clay-cup chai — order straight to WhatsApp. No apps, no commission."
    />
    <!-- og:image is best as an absolute URL in production (set your deployed origin) -->
    <meta property="og:image" content="/brand/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Park Street Adda — Kolkata's living-room cafe" />
    <meta
      name="twitter:description"
      content="Rolls, kosha mangsho & clay-cup chai — order straight to WhatsApp. No apps, no commission."
    />
    <meta name="twitter:image" content="/brand/og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
